<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Browser checks</title>
<!--
  Runs every browser instrument in ui/src/verify-*.ts, in turn, and shows one verdict each.
  See ui/src/verify-all.ts for why this is a page rather than a headless browser.

  Build first (`npm run build:ui`, which `npm run check` and `npm run ui` both do), then open
  /ui/verify.html on the dev server. Results are also left on `window.verifyResults` so a driver
  can read them without scraping the table.
-->
<style>
  :root { color-scheme: dark; --bg: #241C22; --card: #3A2C34; --line: #5A454E; --ink: #F3E7DE;
          --dim: #B9A5A8; --ok: #8FCB8F; --bad: #F08A7E; }
  body { margin: 0; padding: 18px; background: var(--bg); color: var(--ink);
         font: 14px/1.5 -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
  h1 { font-size: 18px; margin: 0 0 4px; }
  p { margin: 0 0 14px; color: var(--dim); }
  button { font: inherit; font-weight: 600; padding: 10px 18px; background: var(--card); color: var(--ink);
           border: 1px solid var(--line); border-radius: 8px; cursor: pointer; }
  button:disabled { opacity: .5; cursor: default; }
  #summary { margin: 14px 0; font-weight: 600; }
  #summary.ok { color: var(--ok); } #summary.bad { color: var(--bad); }
  table { border-collapse: collapse; width: 100%; max-width: 760px; }
  td { padding: 6px 8px; border-top: 1px solid var(--line); vertical-align: top; }
  td.v { font-weight: 700; width: 4.5em; } td.ms { color: var(--dim); text-align: right; width: 5em; }
  .ok { color: var(--ok); } .bad { color: var(--bad); } .wait { color: var(--dim); }
  details { color: var(--dim); } pre { white-space: pre-wrap; word-break: break-word; font-size: 11px; margin: 4px 0 0; }
</style>
</head>
<body>
<h1>Browser checks</h1>
<p>Every instrument in <code>ui/src/verify-*.ts</code>, one after another. Takes about half a minute.</p>
<button id="run">Run all</button>
<div id="summary"></div>
<table><tbody id="rows"></tbody></table>
<!-- The instruments import `kit.ts`, which reads the kit's `LR` global, exactly as the app does. -->
<script src="/docs/kit/lr-kit.js"></script>
<script type="module">
  import { INSTRUMENTS, runAll } from '/ui/dist/ui/src/verify-all.js';

  const rows = document.getElementById('rows');
  const summary = document.getElementById('summary');
  const button = document.getElementById('run');

  function reset() {
    rows.replaceChildren(...INSTRUMENTS.map((instrument) => {
      const tr = document.createElement('tr');
      tr.innerHTML = '<td class="v wait">—</td><td class="n"></td><td class="ms"></td>';
      tr.querySelector('.n').textContent = instrument.name;
      return tr;
    }));
  }
  reset();

  button.addEventListener('click', async () => {
    button.disabled = true;
    reset();
    summary.className = '';
    summary.textContent = 'Running…';
    window.verifyResults = undefined;
    const outcomes = await runAll((o, i) => {
      const tr = rows.children[i];
      const v = tr.querySelector('.v');
      v.className = 'v ' + (o.pass ? 'ok' : 'bad');
      v.textContent = o.pass ? 'PASS' : 'FAIL';
      tr.querySelector('.ms').textContent = o.ms + ' ms';
      const details = document.createElement('details');
      const label = document.createElement('summary');
      label.textContent = o.pass ? 'result' : (o.error ?? 'failed: ' + o.failed.join(', '));
      const pre = document.createElement('pre');
      pre.textContent = JSON.stringify(o.result ?? o.error, null, 2);
      details.append(label, pre);
      tr.querySelector('.n').append(details);
    });
    const failed = outcomes.filter((o) => !o.pass);
    summary.className = failed.length ? 'bad' : 'ok';
    summary.textContent = failed.length
      ? `${failed.length} of ${outcomes.length} failed: ${failed.map((o) => o.name).join(', ')}`
      : `All ${outcomes.length} passed.`;
    window.verifyResults = outcomes;
    button.disabled = false;
  });
</script>
</body>
</html>
