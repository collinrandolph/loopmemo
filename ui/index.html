<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<!-- `maximum-scale` and `user-scalable` are ignored by iOS Safari and honoured elsewhere. They are
     one of five things that suppress zoom here; the others are `touch-action: manipulation` in
     app.css, the 16px input rule beside it, the `gesturestart` guard in app.ts, and the second-tap
     `touchend` guard in gesture.ts — which is the only one iOS honours on a tile. Any one alone
     leaves a way to zoom, and on a screen made of swipe targets a stuck zoom is unusable. -->
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no">
<title>Audio Loop Recorder</title>
<!-- A Home Screen web app (v1's platform — docs/hosting.md). Opened from the Home Screen it runs
     full screen, with no address bar to swipe, no tab strip and no pull-to-reload, which is most of
     what locking the gestures down takes. Every path here is RELATIVE, because GitHub Pages serves
     the app from a subfolder and an absolute `/ui/...` would point outside it. -->
<link rel="manifest" href="manifest.webmanifest">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Loops">
<!-- `default`, not `black-translucent`: translucent lays the page under the status bar, and the top
     of this page is the light body in some states, where white status text would vanish. -->
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#34232B">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<link rel="stylesheet" href="../docs/kit/lr-kit.css">
<link rel="stylesheet" href="app.css">
</head>
<body>
<script src="../docs/kit/lr-kit.js"></script>
<script type="module" src="dist/ui/src/app.js"></script>
</body>
</html>
