# Publishes the web app to GitHub Pages on every push to main (docs/hosting.md).
#
# One-time setup in the repo: Settings → Pages → Source: "GitHub Actions".
# The site is https://<user>.github.io/<repo>/ — every URL in the app is relative, so the subfolder
# needs no configuration.

name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time; a newer push replaces a queued one rather than racing it.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # A build that fails the checks is never published.
      - run: npm run check

      - run: npm run build:app

      - uses: actions/upload-pages-artifact@v3
        with:
          path: app/www

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
