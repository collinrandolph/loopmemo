# Publishes the web app to GitHub Pages — from the `live` branch only (docs/hosting.md).
#
# **`main` does not deploy** (2026-09-18). It did, and that made every push a release: work that
# wanted a device to judge it — a restyle, a fix that needs trying on the phone — was on the phone
# whether or not it was ready. `live` is a pointer at the commit the site is serving, moved
# deliberately:
#
#     npm run publish     # force-moves live to HEAD and pushes it, which deploys
#
# Rolling back is the same move at an older commit (`git push -f origin <sha>:live`), so what is
# published is always visible as one ref rather than inferred from the run history.
#
# **One-time setup, twice over.** Settings → Pages → Source: "GitHub Actions", and Settings →
# Environments → github-pages → Deployment branches and tags → add `live`. That environment is
# created allowing the default branch only, so the first push to `live` built fine and was refused
# at the deploy with no step and no message. Until `live` is allowed there, publish by hand:
# Actions → Deploy to GitHub Pages → Run workflow, which runs on `main` (allowed) and deploys
# whatever `live` points at, because the checkout below takes the ref rather than the run's branch.
# The site is https://<user>.github.io/<repo>/ — every URL in the app is relative, so the subfolder
# needs no configuration.

name: Deploy to GitHub Pages

on:
  push:
    branches: [live]
  workflow_dispatch:
    inputs:
      ref:
        description: 'Branch or commit to publish'
        default: live
        required: false

permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time; a newer push replaces a queued one rather than racing it.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # **Not the run's own ref.** A manual run starts on `main`, and publishing main is exactly
      # what this split exists to prevent, so the content published is always what `live` names.
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || 'live' }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # A build that fails the checks is never published.
      - run: npm run check

      - run: npm run build:app

      - uses: actions/upload-pages-artifact@v3
        with:
          path: app/www

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
